[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultratensor"
version = "0.1.0"
description = "UltraTensor (Raphael): MoE surgery, expert splicing, and serving for DeepSeek-V4-class models"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "gguf>=0.10", "safetensors>=0.4"]
license = { text = "MIT" }

[project.optional-dependencies]
torch = ["torch>=2.0"]
full = ["torch>=2.0", "safetensors>=0.4"]

[project.scripts]
ultratensor = "ultratensor.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ultratensor*"]
